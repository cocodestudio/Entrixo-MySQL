name: entrixo
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  firebase_messaging: ^16.1.1
  firebase_core: ^4.4.0
  mobile_scanner: ^7.1.4
  pdf: ^3.11.3
  excel: ^4.0.6
  to_csv: ^6.0.1
  open_file: ^3.5.11
  permission_handler: ^12.0.1
  image_gallery_saver_plus: ^4.0.1
  geolocator: ^14.0.2
  vibration: ^3.1.6
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_svg: ^2.2.3
  flutter_riverpod: ^3.2.0
  device_info_plus: ^12.3.0
  shared_preferences: ^2.5.4
  qr_flutter: ^4.1.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  dio: ^5.9.1
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  internet_connection_checker_plus: ^2.9.1+2
  in_app_update: ^4.2.5
  intl: ^0.20.2
  flutter_local_notifications: ^17.2.2


dependency_overrides:
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: PoiretOne
      fonts:
        - asset: assets/fonts/PoiretOne-Regular.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/splash_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/splash_logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/app_icon.png

  android_12:
    image: assets/icons/app_icon.png
    icon_background_color: "#FFFFFF"

  android: true
  ios: true
  fullscreen: false
  android_gravity: center
  ios_content_mode: center